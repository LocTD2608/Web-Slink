apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-reg-backend
  namespace: default
  labels:
    app: course-reg-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-reg-backend
  template:
    metadata:
      labels:
        app: course-reg-backend
    spec:
      containers:
      - name: backend
        image: course-reg-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1024Mi"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service:5672/"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
