apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: course-reg-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "15"
spec:
  rules:
  - host: dkhp.daihoc.edu.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: course-reg-frontend-svc
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: course-reg-backend-svc
            port:
              number: 8000
