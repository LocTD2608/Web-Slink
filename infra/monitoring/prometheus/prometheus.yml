global:
  scrape_interval: 3s
  evaluation_interval: 3s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['fastapi-node-1:8000', 'fastapi-node-2:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:9101']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: containers
    static_configs:
      - targets: ['node-exporter:9100']

