events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # Lab fixtures have distinct signed JWTs. Real deployments need a trusted identity limiter.
  map $http_authorization $limit_key { default $http_authorization; "" $binary_remote_addr; }
  limit_req_zone $limit_key zone=lab_limit:10m rate=15r/s;
  limit_req_status 429;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream backend { zone backend 64k; least_conn; server fastapi-node-1:8000 resolve; server fastapi-node-2:8000 resolve; keepalive 32; }
  server {
    listen 80;
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
    location /api/ {
      limit_req zone=lab_limit burst=30 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
    location /health { proxy_pass http://backend; }
    location /ready { proxy_pass http://backend; }
  }
}

