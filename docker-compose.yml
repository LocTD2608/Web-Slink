services:
  # 1. Cơ sở dữ liệu quan hệ chính (System of Record)
  postgres:
    image: postgres:16-alpine
    container_name: course-reg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_reg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_reg"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # 2. In-Memory Store & Atomic Lua CAS Engine
  redis:
    image: redis:7-alpine
    container_name: course-reg-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Message Broker Buffer (Hấp thụ đột biến tải ghi)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: course-reg-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Web UI Management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 4. Backend FastAPI Node 1
  fastapi-node-1:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    container_name: course-reg-app-1
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/course_reg
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: super-secret-course-reg-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 5. Backend FastAPI Node 2
  fastapi-node-2:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    container_name: course-reg-app-2
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/course_reg
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: super-secret-course-reg-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 6. Registration Background Worker (Compensating Rollback)
  worker:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    container_name: course-reg-worker
    restart: unless-stopped
    command: python src/backend/worker.py
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/course_reg
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 7. Reverse Proxy, Rate Limiting & Load Balancer L7
  nginx:
    image: nginx:alpine
    container_name: course-reg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - fastapi-node-1
      - fastapi-node-2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
