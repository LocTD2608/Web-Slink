name: course-lab
x-app: &app
  restart: unless-stopped
  build:
    context: .
    dockerfile: infra/docker/app/Dockerfile
  environment: &env
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/course_reg
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    LAB_MODE: "true"
    RESULT_DIR: /results
    REGISTRATION_MODE: ${REGISTRATION_MODE:-redis_queue}
    JWT_SECRET: ${JWT_SECRET:-local-lab-demo-key-not-for-production}
  volumes: ["./artifacts/benchmarks:/results"]
  networks: [app, data]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
    interval: 5s
    timeout: 4s
    retries: 30
  deploy:
    resources:
      limits: {cpus: "1", memory: 512M}
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: course_reg, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_reg"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits: {cpus: "2", memory: 1G}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    deploy:
      resources:
        limits: {cpus: "1", memory: 768M}
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: guest, RABBITMQ_DEFAULT_PASS: guest}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./infra/monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [app, data]
    ports: ["127.0.0.1:15682:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 4s
      retries: 30
    deploy:
      resources:
        limits: {cpus: "1", memory: 768M}
  fastapi-node-1:
    <<: *app
  fastapi-node-2:
    <<: *app
  worker:
    <<: *app
    command: python -m src.backend.worker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/metrics"]
      interval: 5s
      timeout: 2s
      retries: 30
  nginx:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    ports: ["127.0.0.1:8088:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [app]
    depends_on:
      fastapi-node-1: {condition: service_healthy}
      fastapi-node-2: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver", "--storage.tsdb.retention.time=2d"]
    volumes: ["./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [app, data]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: lab-admin, GF_USERS_ALLOW_SIGN_UP: "false"}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    networks: [app]
  redis-exporter:
    image: oliver006/redis_exporter:v1.76.0
    profiles: [monitoring]
    environment: {REDIS_ADDR: "redis://redis:6379"}
    networks: [data]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment: {DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/course_reg?sslmode=disable"}
    networks: [data]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command: ["--collector.textfile.directory=/textfile", "--collector.disable-defaults", "--collector.textfile"]
    volumes: ["./artifacts/metrics:/textfile:ro"]
    networks: [data]
  redisinsight:
    image: redis/redisinsight:2.70
    profiles: [monitoring]
    ports: ["127.0.0.1:8001:5540"]
    volumes: [redisinsightdata:/data]
    networks: [app, data]
  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,max"
    volumes: ["./tests/load_testing:/scripts:ro", "./artifacts/benchmarks:/results"]
    networks: [app]
volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  promdata:
  grafanadata:
  redisinsightdata:
networks:
  app:
  data:
    internal: true

